<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Proposal Intelligence OS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="main navigation">
        <div class="brand">
          <span class="brand-mark">AI</span>
          <div>
            <p class="eyebrow">Opportunity Brief</p>
            <h1>AI Proposal OS</h1>
          </div>
        </div>

        <nav class="nav" aria-label="views">
          <button class="nav-item active" type="button" data-view="today">Today</button>
          <button class="nav-item" type="button" data-view="timeline">Timeline</button>
          <button class="nav-item" type="button" data-view="ideas">Ideas</button>
          <button class="nav-item" type="button" data-view="docs">Design Docs</button>
          <button class="nav-item" type="button" data-view="sources">Sources</button>
        </nav>

        <section class="mode-card" aria-label="runtime status">
          <div class="mode-row">
            <span>APP_MODE</span>
            <strong id="mode">loading</strong>
          </div>
          <div class="mode-row">
            <span>AI_PROVIDER</span>
            <strong id="provider">loading</strong>
          </div>
          <div class="mode-row">
            <span>PAID_AI_ENABLED</span>
            <strong id="paidAi">loading</strong>
          </div>
          <div class="mode-row">
            <span>Cost Today</span>
            <strong id="cost">loading</strong>
          </div>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="todayDate">Today</p>
            <h2 id="viewTitle">AI Proposal Intelligence OS</h2>
          </div>
          <div class="topbar-actions">
            <span class="status-pill">Mode: <strong id="modeTop">loading</strong></span>
            <span class="status-pill">推定コスト: <strong id="costTop">loading</strong></span>
            <button id="runButton" class="primary-button" type="button">Run Intelligence</button>
          </div>
        </header>
        <div class="run-meta">
          <span id="timestamp">Not run yet</span>
        </div>

        <section id="notice" class="notice hidden" aria-live="polite"></section>
        <section id="content" class="content" aria-live="polite">
          <div class="state-card">
            <span class="loader"></span>
            <strong>Mock briefを準備しています</strong>
            <p>AIニュースを、提案・PoC・設計書の種として再整理します。</p>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
