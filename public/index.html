<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Proposal Intelligence OS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">AI Business Development Knowledge Base</p>
        <h1>AI Proposal Intelligence OS</h1>
      </div>
      <button id="runButton" class="primary-button" type="button">Run Intelligence</button>
    </header>

    <main class="layout">
      <section class="panel mode-panel" aria-label="runtime configuration">
        <div>
          <span class="label">Mode</span>
          <strong id="mode">loading</strong>
        </div>
        <div>
          <span class="label">AI Provider</span>
          <strong id="provider">loading</strong>
        </div>
        <div>
          <span class="label">Paid AI</span>
          <strong id="paidAi">loading</strong>
        </div>
        <div>
          <span class="label">Limit</span>
          <strong id="limit">loading</strong>
        </div>
      </section>

      <section class="summary-grid" aria-label="run summary">
        <article>
          <span class="metric" id="collected">0</span>
          <span class="label">Collected</span>
        </article>
        <article>
          <span class="metric" id="analyzed">0</span>
          <span class="label">Analyzed</span>
        </article>
        <article>
          <span class="metric" id="docs">0</span>
          <span class="label">Design Seeds</span>
        </article>
        <article>
          <span class="metric" id="fallback">0</span>
          <span class="label">Fallback</span>
        </article>
      </section>

      <section>
        <div class="section-title">
          <h2>Proposal Intelligence</h2>
          <span id="timestamp"></span>
        </div>
        <div id="items" class="items"></div>
      </section>

      <section>
        <div class="section-title">
          <h2>Design Doc Seeds</h2>
        </div>
        <div id="designDocs" class="doc-list"></div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
